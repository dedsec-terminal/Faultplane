name: RSS Ingestion

on:
  schedule:
    - cron: "0 */4 * * *" # Run every 4 hours
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "rss-ingestion"
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure State Directory Exists
        run: |
          mkdir -p data

      - name: Run Intel Balancer (RSS Fetcher)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scripts/rss_fetcher.py

      - name: Commit Content Changes
        run: |
          git config user.name "DedSec-Terminal Bot"
          git config user.email "actions@github.com"
          git add content/posts data/rss_state.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(content): Automated RSS Intelligence Update"
            git push
          fi

  deploy:
    needs: fetch
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
