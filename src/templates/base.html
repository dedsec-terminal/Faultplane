<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <meta name="description" content="{{ meta_description }}">
    <meta name="theme-color" content="#0A0A0A">
    <link rel="icon" href="{{ base_url }}/images/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ base_url }}/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ base_url }}/images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ base_url }}/images/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ base_url }}/css/style.css">
</head>
<body data-base-url="{{ base_url }}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
        <div class="header-inner">
            <a class="site-brand" href="{{ base_url }}/index.html">
                <img src="{{ base_url }}/images/favicon-32x32.png" alt="" width="20" height="20">
                Faultplane
            </a>
            <nav class="site-nav" aria-label="Primary navigation">
                <ul>
                    {% for nav_item in nav_items %}
                    <li>
                        <a href="{{ nav_item.href }}"{% if nav_item.id == active_nav %} class="active" aria-current="page"{% endif %}>{{ nav_item.label }}</a>
                    </li>
                    {% endfor %}
                </ul>
            </nav>
            <button type="button" class="search-trigger" id="search-trigger" aria-haspopup="dialog">
                Search <kbd class="search-kbd" aria-hidden="true">/</kbd>
            </button>
        </div>
    </header>

    <main class="content-area" id="main-content">
        {{ content | safe }}
    </main>

    <div class="search-modal" id="search-modal" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="search-input-label">
        <div class="search-backdrop" data-close-search></div>
        <div class="search-dialog">
            <div class="search-input-row">
                <label id="search-input-label" for="search-input" class="sr-only">Search Faultplane intelligence</label>
                <input type="search" id="search-input" placeholder="Search CVEs, malware, breaches, tags..." autocomplete="off" spellcheck="false">
                <button type="button" class="search-close" data-close-search aria-label="Close search">ESC</button>
            </div>
            <div class="search-status" id="search-status" role="status">Type to search indexed intelligence records</div>
            <ul class="search-results" id="search-results"></ul>
        </div>
    </div>

    <script src="{{ base_url }}/js/app.js" defer></script>
</body>
</html>
