name: RSS Ingestion

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "rss-ingestion"
  cancel-in-progress: true

jobs:
  fetch:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      pushed_sha: ${{ steps.commit.outputs.pushed_sha }}
      should_deploy: ${{ steps.commit.outputs.should_deploy }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Offline Unit Tests
        run: |
          python -B -m unittest discover -s scripts -v

      - name: Run Intel Balancer (RSS Fetcher)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          GROQ_FALLBACK_MODEL: openai/gpt-oss-120b
        run: |
          python scripts/rss_fetcher.py

      - name: Run CVE Fetcher (NVD + KEV)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          GROQ_FALLBACK_MODEL: openai/gpt-oss-120b
        run: |
          python scripts/cve_fetcher.py

      - name: Commit Content Changes
        id: commit
        run: |
          git config user.name "DedSec-Terminal Bot"
          git config user.email "actions@github.com"
          git add content/posts data/rss_state.json content/cves data/cve_state.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            fi
          else
            CONTENT_CHANGED=false
            if ! git diff --cached --quiet -- content/posts content/cves; then
              CONTENT_CHANGED=true
            fi

            git commit -m "chore(content): Automated Intelligence & CVE Update"
            PUSHED=false
            for i in 1 2 3; do
              if git push origin main; then
                echo "Push succeeded on attempt $i"
                PUSHED=true
                break
              else
                echo "Push rejected on attempt $i, rebasing..."
                git pull --rebase origin main || { echo "Rebase conflict! Aborting."; git rebase --abort; exit 1; }
              fi
            done

            if [ "$PUSHED" != "true" ]; then
              echo "Failed to push after 3 attempts."
              exit 1
            fi

            echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            if [ "$CONTENT_CHANGED" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  deploy:
    needs: fetch
    if: needs.fetch.outputs.should_deploy == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.fetch.outputs.pushed_sha }}
