<article class="post">
    <header class="post-header">
        <h2>{{ title }}</h2>
        <div class="post-metadata">
            <span class="date">{{ date }}</span>
            <span class="categories">{{ categories }}</span>
        </div>
    </header>
    <div class="post-body">
        {{ body }}
        {{ quote_html }}
        {{ source_html }}
    </div>
</article>
